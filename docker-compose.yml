# 外包收发包平台 - 子模块编排
# 用法：docker compose up -d --build
# 可选：--env-file .env 覆盖 versionwatch 配置（参考 .env.example）
name: outsource-pip

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: outsource_inner_pipe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin  -d outsource_inner_pipe"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  versionwatch:
    build:
      context: .
      dockerfile: docker/versionwatch.Dockerfile
    environment:
      # VW_ROOT_DIR: /srv/ftp
      # VW_FTP_LOG: /var/log/vsftpd/vsftpd.log
      # VW_DATABASE_URL: postgresql://versionwatch:versionwatch@postgres:5432/versionwatch
      # VW_LOG_STATE_FILE: /var/lib/versionwatch/ftp_log.state
      VW_LOG_LEVEL: INFO
    volumes:
      - ftpdata:/srv/ftp
      - ftplogs:/var/log/vsftpd
      - vwstate:/var/lib/versionwatch
      - outsourcelogs:/var/log/outsource
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 演示用 FTP 服务；生产环境通常由宿主机已有 vsftpd 提供，
  # versionwatch 改为 bind mount 挂载真实存储与日志即可。
  vsftpd:
    build:
      context: .
      dockerfile: docker/vsftpd/Dockerfile
    environment:
      FTP_USER: oip_admin
      FTP_PASS: 123456
    ports:
      - "21:21"
      - "30000-30100:30000-30100"
      - "8000:8000"
    volumes:
      - ftpdata:/srv/ftp
      - ftplogs:/var/log/vsftpd
      - outsourcelogs:/var/log/outsource
    restart: unless-stopped

volumes:
  pgdata:
  ftpdata:
  ftplogs:
  vwstate:
  outsourcelogs: