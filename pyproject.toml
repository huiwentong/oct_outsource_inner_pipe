[project]
name = "outsource-pip"
version = "0.1.0"
description = "外包收发包流程平台根工程（uv 管理依赖，docker 编排各子模块）"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=6.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "tzdata>=2024.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
versionwatch = "versionwatch.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versionwatch/src/versionwatch"]

[tool.pytest.ini_options]
testpaths = ["versionwatch/tests"]
addopts = "-q"
