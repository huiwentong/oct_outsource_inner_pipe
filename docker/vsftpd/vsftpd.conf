# versionwatch 演示用 vsftpd 配置
# 关键：开启 xferlog 摘要日志，供 versionwatch 的 VW_FTP_LOG 解析
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
local_umask=022
dirmessage_enable=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log
xferlog_std_format=NO
log_ftp_protocol=YES
syslog_enable=NO

listen=YES
listen_ipv6=NO
background=NO

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100

chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO
nopriv_user=nobody