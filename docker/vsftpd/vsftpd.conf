# versionwatch 演示用 vsftpd 配置
# 关键：开启 xferlog 摘要日志，供 versionwatch 的 VW_FTP_LOG 解析
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
local_umask=022
dirmessage_enable=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd/xfervsftpd.log
xferlog_std_format=NO
dual_log_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd/vsftpd.log
syslog_enable=NO

listen=YES
listen_ipv6=NO
background=NO

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100
pasv_address=192.168.30.9

chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO
nopriv_user=nobody

ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ssl/private/vsftpd.pem
rsa_private_key_file=/etc/ssl/private/vsftpd.pem