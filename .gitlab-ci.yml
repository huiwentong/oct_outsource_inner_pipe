build-job:
  stage: build
  script:
    - echo "你好，$GITLAB_USER_LOGIN！"

test-job1:
  stage: test
  script:
    - echo "这个作业测试某些东西"

test-job2:
  stage: test
  script:
    - echo "这个作业测试某些东西，但比 test-job1 花费更多时间。"
    - echo "在 echo 命令完成后，它运行 sleep 命令 20 秒"
    - echo "这模拟了一个比 test-job1 多运行 20 秒的测试"
    - sleep 20

deploy-prod:
  stage: deploy
  script:
    - echo "这个作业从 $CI_COMMIT_BRANCH 分支部署某些东西。"
  environment: production